tempo:
  retention: 24h          # keep traces for 1 day (tune as needed)

persistence:
  enabled: true
  size: 5Gi
  storageClassName: local-path   # match your Prometheus storage class

# Enable OTLP receivers so apps/instrumentation can push traces in
tempo:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
